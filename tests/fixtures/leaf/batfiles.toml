# A leaf repository shaped like one someone would actually keep: several
# actions over a directory tree, with files the manifest never names, and both
# ways of declaring a symlink.
#
# The actions that need no symlink come first, so a platform that cannot make
# one still runs them before the refusal stops the list.

# The shell writes its history here, and writing it is what fails if the
# directory is missing — a directory nothing else in the manifest creates.
[[actions]]
type = "create-dir"
id = "zsh-cache"
group = "shell"
dest = "~/.cache/zsh"

# Seeded rather than linked, because it holds the identity of one machine:
# `git/gitconfig` includes it, editing it must not write into the repository,
# and a later sync must not undo the edit.
[[actions]]
type = "copy"
id = "gitconfig-local"
group = "git"
source = "templates/gitconfig.local"
dest = "~/.config/git/local"

# The same bargain once per child: `.zshrc` sources everything in this
# directory, the repository supplies the starting contents, and what is already
# there is left alone while the rest is filled in.
[[actions]]
type = "copy-dir"
id = "zsh-local"
group = "shell"
source-dir = "zsh-local"
dest-dir = "~/.config/zsh/local"

[[actions]]
type = "symlink"
id = "zshrc"
group = "shell"
source = "shell/zshrc"
dest = "~/.zshrc"

[[actions]]
type = "symlink"
group = "shell"
source = "shell/zshenv"
dest = "~/.zshenv"

[[actions]]
type = "symlink"
group = "shell"
source = "shell/aliases.zsh"
dest = "~/.config/zsh/aliases.zsh"

[[actions]]
type = "symlink"
id = "gitconfig"
group = "git"
source = "git/gitconfig"
dest = "~/.gitconfig"

[[actions]]
type = "symlink"
group = "git"
source = "git/gitignore"
dest = "~/.config/git/ignore"

[[actions]]
type = "symlink"
id = "nvim"
group = "editor"
source = "editor/nvim"
dest = "~/.config/nvim"

[[actions]]
type = "symlink"
id = "batgrep"
group = "bin"
source = "bin/batgrep"
dest = "~/.local/bin/batgrep"

# The whole of `files/` in one entry: adding a dotfile there needs no manifest
# change, which is the reason this exists rather than three more `symlink`
# records. The names are undotted in the repository and dotted in the home.
[[actions]]
type = "symlink-dir"
id = "rcfiles"
group = "shell"
source-dir = "files"
dest-dir = "~"
dot-prefix = true
