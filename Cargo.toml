[package]
name = "batfiles"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Adam Batkin <adam@batkin.net>"]
repository = "https://github.com/abatkin/batfiles-rust"
rust-version = "1.94"

# Only dependencies implemented code actually uses are declared here. Expression
# evaluation, hashing, and archives arrive with the features that need them.
[dependencies]
# clap drives argument parsing and help/usage generation. Dual-licensed
# MIT/Apache-2.0.
clap = { version = "4.5", features = ["derive"] }

# serde derives the on-disk records for `batfiles.toml` and the three local state
# documents. Both dual-licensed MIT/Apache-2.0.
serde = { version = "1", features = ["derive"] }
toml = "1"

# jiff parses and formats the RFC 3339 `captured-at` timestamp in the
# dynamic-variable cache, and its "friendly" format defines the `cache` and
# `command-timeout` duration grammar. Default features are off: a timestamp is an
# instant and a duration is relative to nothing, so neither the bundled time-zone
# database nor system time-zone lookup is needed. Dual-licensed Unlicense/MIT.
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }

# tempfile gives stdout captures a secure, self-cleaning file with independent
# reader and writer handles. A file cannot fill like a pipe while batfiles waits
# for the command, and a background descendant retaining stdout cannot postpone
# end-of-file. Dual-licensed MIT/Apache-2.0.
tempfile = "3"

[dev-dependencies]
# assert_cmd locates and runs the Cargo-built `batfiles` binary in the end-to-end
# CLI tests. Dual-licensed MIT/Apache-2.0.
assert_cmd = "2"
