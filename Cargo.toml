[package]
name = "batfiles"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Adam Batkin <adam@batkin.net>"]
repository = "https://github.com/abatkin/batfiles-rust"
rust-version = "1.94"

# Only dependencies implemented code actually uses are declared here. Hashing and
# archives arrive with the features that need them.
[dependencies]
# clap drives argument parsing and help/usage generation. Dual-licensed
# MIT/Apache-2.0.
clap = { version = "4.5", features = ["derive"] }

# serde derives the on-disk records for `batfiles.toml` and the three local state
# documents. Both dual-licensed MIT/Apache-2.0.
serde = { version = "1", features = ["derive"] }
toml = "1"

# jiff parses and formats the RFC 3339 `captured-at` timestamp in the
# dynamic-variable cache, and its "friendly" format defines the `cache` and
# `command-timeout` duration grammar. Default features are off: a timestamp is an
# instant and a duration is relative to nothing, so neither the bundled time-zone
# database nor system time-zone lookup is needed. Dual-licensed Unlicense/MIT.
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }

# simple-expressions is the Simple Expressions language `docs/repoformat.md` pins
# `when`/`unless` to. 0.4.1 is a floor rather than a preference, for three
# reasons. 0.4 added `Coercions`, which is what lets batfiles define its own
# truthiness uniformly — for a condition's result and for every `&&`, `||`, and
# `!` operand alike — instead of bolting a `bool()` builtin onto the language.
# 0.4.1 then made identifiers that merely begin with a boolean keyword parse as
# identifiers (`trueish` is a legal variable name here), and made integer
# arithmetic checked, so a manifest — including a third-party remote's — reports
# an overflow instead of aborting the process. Dual-licensed MIT/Apache-2.0.
simple-expressions = "0.4.1"

# gethostname supplies `facts.hostname`, which has no equivalent in std: `uname`'s
# nodename on Unix, `GetComputerNameExW` on Windows. It is infallible by
# signature and adds one line to `Cargo.lock`, since `rustix` is already in the
# tree by way of `tempfile`. Dual-licensed MIT/Apache-2.0.
gethostname = "1"

# tempfile gives stdout captures a secure, self-cleaning file with independent
# reader and writer handles. A file cannot fill like a pipe while batfiles waits
# for the command, and a background descendant retaining stdout cannot postpone
# end-of-file. Dual-licensed MIT/Apache-2.0.
tempfile = "3"

[dev-dependencies]
# assert_cmd locates and runs the Cargo-built `batfiles` binary in the end-to-end
# CLI tests. Dual-licensed MIT/Apache-2.0.
assert_cmd = "2"
