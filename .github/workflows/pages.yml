name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:
  # The release workflow calls this after verifying a stable release.
  workflow_call:

# Builds the Pages site with dist:pages from Taskfile.yml and deploys it;
# docs/distribution.md describes the site. Third-party actions are pinned to a
# commit SHA, as in ci.yml.

permissions:
  contents: read

env:
  # Where this repository's releases are published, which the site copies
  # from; and the base their installers are stamped with.
  PUBLISHED_BASE: ${{ format('{0}/{1}/releases', github.server_url, github.repository) }}
  RELEASE_BASE: ${{ vars.BATFILES_BASE || format('{0}/{1}/releases', github.server_url, github.repository) }}

defaults:
  run:
    shell: bash

jobs:
  # Only a site built by GitHub Actions takes a deploy; a repository without
  # Pages, or serving it from a branch, is left alone.
  plan:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - name: Read the Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>"$RUNNER_TEMP/error"); then
            :
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/error"; then
            build_type=none
          else
            cat "$RUNNER_TEMP/error" >&2
            exit 1
          fi
          if [ "$build_type" = workflow ]; then
            echo deploy=true >>"$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying: Pages is not enabled with GitHub Actions as its source (build type: $build_type)."
            echo deploy=false >>"$GITHUB_OUTPUT"
          fi

  # One job, so that a run builds, deploys, and verifies before the next one
  # starts: the last deploy copies a latest at least as new as any before it.
  deploy:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: task dist:pages
        id: site
        run: task --silent dist:pages OUT=target/site FROM="$PUBLISHED_BASE" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site/

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

      - name: task dist:verify
        run: >-
          task dist:verify
          URL="$PUBLISHED_BASE"
          VERSION="${{ steps.site.outputs.version }}"
          LATEST=yes
          STAMPED="$RELEASE_BASE"
          PAGES="${{ steps.deployment.outputs.page_url }}"
