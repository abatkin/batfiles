# A leaf repository whose action names a list of repositories rather than one.
#
# Apart from `cloning` because a list needs several bare repositories where one
# action needs one, and the tests that clone should not pay for what they do not
# name. The list's own repositories are placeholders the test fills in, since no
# test may reach the network (`guidance.md`, "Test environments").

# The action step 4.8 retires `install_bundles` for: one directory holding a
# checkout per plugin, listed in a file that is edited by pasting a URL onto the
# end of it.
[[actions]]
type = "git-clone-list"
id = "zsh-plugins"
group = "shell"
source = "manifests/zsh-plugins.txt"
dest-dir = "~/.oh-my-zsh/custom/plugins"
