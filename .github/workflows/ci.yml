name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI's only extra responsibility over local development is matrix/runner setup.
# The actual work is delegated to `task ci`, the same entry point developers run.
#
# Third-party actions are pinned to a commit SHA (with the human-readable tag in
# a trailing comment) so a moved tag can't change what runs in CI.
jobs:
  ci:
    name: task ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # rust-toolchain.toml pins the compiler/clippy version; this honors it so
      # local and CI use the identical toolchain.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # rust-toolchain.toml already lists this target, which covers a fresh
      # install; this covers a runner image that has the pinned toolchain
      # without it. `task lint` checks Windows so an ubuntu-only run still
      # catches a rotted platform gate.
      - name: Install the cross-lint target
        run: rustup target add x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.x

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: task ci
        run: task ci
