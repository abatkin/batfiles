[package]
name = "batfiles"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Adam Batkin <adam@batkin.net>"]
repository = "https://github.com/abatkin/batfiles-rust"
rust-version = "1.94"

# One line per dependency, saying what uses it. A dependency is added by the
# slice that needs it, not ahead of it.
[dependencies]
# Argument parsing and help/usage generation.
clap = { version = "4.5", features = ["derive"] }

# The on-disk records for `batfiles.toml` and the local state documents.
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
# Locates and runs the Cargo-built binary in the end-to-end CLI tests.
assert_cmd = "2"

# Throwaway repositories and home directories for those tests.
tempfile = "3"
