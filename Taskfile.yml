# Taskfile.yml — single source of truth for tasks (go-task / https://taskfile.dev).
#
# Governing rule: CI must not contain logic that isn't invocable locally.
# Humans and CI invoke the identical entry point: `task ci`.
version: '3'

tasks:
  fmt:
    desc: Check formatting
    cmd: cargo fmt --all -- --check

  lint:
    desc: Run clippy with warnings denied, for the host and for Windows
    cmds:
      - cargo clippy --all-targets -- -D warnings
      # CI is ubuntu-only, so a `#[cfg(unix)]` gate that has rotted is caught
      # here or nowhere. Checking needs the target's std, not a linker;
      # rust-toolchain.toml asks for it, so `rustup target add
      # x86_64-pc-windows-msvc` is only needed by a toolchain predating that.
      - cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  test:
    desc: Run the project test suite
    cmd: cargo test

  deny:
    desc: Check dependencies (advisories, licenses, bans)
    cmd: cargo deny check

  build:
    desc: Build the project (debug)
    cmd: cargo build

  build:release:
    desc: Build the project (release)
    cmd: cargo build --release

  toolchain:
    internal: true
    desc: Ensure the pinned toolchain is ready before parallel tasks race to sync it
    cmd: rustup show active-toolchain

  ci:
    desc: Everything CI runs — the single shared entry point
    cmds:
      - task: toolchain
      - task: ci:checks

  ci:checks:
    internal: true
    deps: [fmt, lint, test, deny, build, build:release]
