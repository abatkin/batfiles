[package]
name = "batfiles"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Adam Batkin <adam@batkin.net>"]
repository = "https://github.com/abatkin/batfiles-rust"
rust-version = "1.94"

[dependencies]
# CLI parsing and help.
clap = { version = "4.5", features = ["derive"] }

# TOML document serialization.
serde = { version = "1", features = ["derive"] }
toml = "1"

# Error messages derived from variants.
thiserror = "2"

# The expression language `when` and `unless` are written in. 0.4.1 is a floor
# rather than a preference: 0.4 added `Coercions`, which is what applies
# batfiles' truthiness to a condition's result and to every `&&`, `||`, and `!`
# operand alike, and 0.4.1 made integer arithmetic checked, so a manifest --
# including a third-party remote's -- reports an overflow instead of aborting.
simple-expressions = "0.4.1"

# `facts.hostname`, which has no equivalent in std: `uname`'s nodename on Unix,
# `GetComputerNameExW` on Windows. Infallible by signature.
gethostname = "1"

# Blocking HTTP with OS certificate roots; automatic decompression is disabled.
ureq = { version = "3.4", default-features = false, features = [
    "rustls",
    "platform-verifier",
] }

# Download checksum verification.
sha2 = "0.11"

# Tar and gzip extraction; extended attributes are not restored.
tar = { version = "0.4", default-features = false }
flate2 = "1"

[dev-dependencies]
# Run the binary in CLI tests.
assert_cmd = "2"

# Temporary fixture directories.
tempfile = "3"

# Loopback HTTP fixtures.
tiny_http = "0.12"
