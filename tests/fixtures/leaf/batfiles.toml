# A leaf repository shaped like one someone would actually keep: several
# actions over a directory tree, with files the manifest never names, and both
# ways of declaring a symlink.
#
# The actions that need no symlink come first, so a platform that cannot make
# one still runs them before the refusal stops the list.

# What this repository answers a condition with. Only the one gated action below
# reads them, so the rest of the installed tree is the same with them as
# without. `has_git` is found out rather than written down: its value is whether
# `git --version` succeeds, cached for a day, and nothing reads it.
[vars]
work = "false"
profile = "personal"
has_git = { command = ["git", "--version"], capture = "status" }

# The shell writes its history here, and writing it is what fails if the
# directory is missing — a directory nothing else in the manifest creates.
[[actions]]
type = "create-dir"
id = "zsh-cache"
group = "shell"
dest = "~/.cache/zsh"

# The one action this repository does not want on every machine: a cache for a
# tool only the work laptop has. `work` is false here, so a run over this
# fixture leaves the directory unmade — which is the assertion that says the
# gate closed rather than that the action was forgotten.
[[actions]]
type = "create-dir"
id = "work-cache"
group = "shell"
dest = "~/.cache/work-tools"
when = "work"

# Seeded rather than linked, because it holds the identity of one machine:
# `git/gitconfig` includes it, editing it must not write into the repository,
# and a later sync must not undo the edit.
[[actions]]
type = "copy"
id = "gitconfig-local"
group = "git"
source = "templates/gitconfig.local"
dest = "~/.config/git/local"

# Two seeds naming one destination, the machine-specific one declared first.
# A seed does not replace, so the first to run is the copy that lands and the
# second reports that it kept what it found. That makes declaration order
# observable in the file's contents rather than only in the order two unrelated
# things happened, which is why the pair is here at all: swap these two records
# and `~/.config/zsh/profile.zsh` holds the other file.
#
# It reads as a repository someone keeps because it is the override idiom
# without the gate. Do not add the gate here when `when` and `unless` arrive:
# a condition that can turn the first record off is a condition under which
# these are two unrelated actions, and the order stops being observable at all.
[[actions]]
type = "copy"
id = "zsh-profile-machine"
group = "shell"
source = "templates/profile.machine.zsh"
dest = "~/.config/zsh/profile.zsh"

[[actions]]
type = "copy"
id = "zsh-profile"
group = "shell"
source = "templates/profile.zsh"
dest = "~/.config/zsh/profile.zsh"

# The same bargain once per child: `.zshrc` sources everything in this
# directory, the repository supplies the starting contents, and what is already
# there is left alone while the rest is filled in.
[[actions]]
type = "copy-dir"
id = "zsh-local"
group = "shell"
source-dir = "zsh-local"
dest-dir = "~/.config/zsh/local"

[[actions]]
type = "symlink"
id = "zshrc"
group = "shell"
source = "shell/zshrc"
dest = "~/.zshrc"

[[actions]]
type = "symlink"
group = "shell"
source = "shell/zshenv"
dest = "~/.zshenv"

[[actions]]
type = "symlink"
group = "shell"
source = "shell/aliases.zsh"
dest = "~/.config/zsh/aliases.zsh"

[[actions]]
type = "symlink"
id = "gitconfig"
group = "git"
source = "git/gitconfig"
dest = "~/.gitconfig"

[[actions]]
type = "symlink"
group = "git"
source = "git/gitignore"
dest = "~/.config/git/ignore"

[[actions]]
type = "symlink"
id = "nvim"
group = "editor"
source = "editor/nvim"
dest = "~/.config/nvim"

[[actions]]
type = "symlink"
id = "batgrep"
group = "bin"
source = "bin/batgrep"
dest = "~/.local/bin/batgrep"

# The whole of `files/` in one entry: adding a dotfile there needs no manifest
# change, which is the reason this exists rather than three more `symlink`
# records. The names are undotted in the repository and dotted in the home.
[[actions]]
type = "symlink-dir"
id = "rcfiles"
group = "shell"
source-dir = "files"
dest-dir = "~"
dot-prefix = true
