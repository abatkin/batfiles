name: Pages

on:
  push:
    branches: [main]
    # What builds or verifies the site; the remaining dist:pages inputs come
    # from the latest release.
    paths:
      - 'site/**'
      - 'docs/**'
      - 'theme/**'
      - 'book.toml'
      - 'dist/docs.sh'
      - 'dist/docs-tools'
      - 'dist/pages.sh'
      - 'dist/verify.sh'
      - 'dist/version.sh'
      - 'Taskfile.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # The release workflow calls this after verifying a stable release.
  workflow_call:

# Builds the Pages site with dist:pages from Taskfile.yml and deploys it;
# docs/contributing/distribution.md describes the site. Third-party actions are pinned to a
# commit SHA, as in ci.yml.

permissions:
  contents: read

env:
  # Where this repository's releases are published, which the site copies
  # from; and the base their installers are stamped with.
  PUBLISHED_BASE: ${{ format('{0}/{1}/releases', github.server_url, github.repository) }}
  RELEASE_BASE: ${{ vars.BATFILES_BASE || format('{0}/{1}/releases', github.server_url, github.repository) }}

defaults:
  run:
    shell: bash

jobs:
  # Only a site built by GitHub Actions takes a deploy; a repository without
  # Pages, or serving it from a branch, is left alone.
  plan:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
      site-url: ${{ steps.pages.outputs.site-url }}
    steps:
      - name: Read the Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >"$RUNNER_TEMP/pages.json" 2>"$RUNNER_TEMP/error"; then
            build_type=$(jq -r .build_type "$RUNNER_TEMP/pages.json")
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/error"; then
            build_type=none
          else
            cat "$RUNNER_TEMP/error" >&2
            exit 1
          fi
          if [ "$build_type" = workflow ]; then
            echo deploy=true >>"$GITHUB_OUTPUT"
            # The URL path the site is served under: / for a custom domain,
            # /<repository>/ for a project site.
            echo "site-url=$(jq -r '.html_url | sub("^[a-z]+://[^/]+"; "") | sub("/*$"; "/")' "$RUNNER_TEMP/pages.json")" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying: Pages is not enabled with GitHub Actions as its source (build type: $build_type)."
            echo deploy=false >>"$GITHUB_OUTPUT"
          fi

  # One job, so that a run builds, deploys, and verifies before the next one
  # starts: the last deploy copies a latest at least as new as any before it.
  deploy:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # Resolve main after acquiring the deployment slot, even for release calls.
      # The rest of this job builds and validates that one checked-out revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: task dist:pages
        id: site
        env:
          SITE_URL: ${{ needs.plan.outputs.site-url }}
        run: task --silent dist:pages OUT=target/site FROM="$PUBLISHED_BASE" SITE_URL="$SITE_URL" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site/

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

      - name: task dist:verify
        run: >-
          task dist:verify
          URL="$PUBLISHED_BASE"
          VERSION="${{ steps.site.outputs.version }}"
          LATEST=yes
          STAMPED="$RELEASE_BASE"
          PAGES="${{ steps.deployment.outputs.page_url }}"
