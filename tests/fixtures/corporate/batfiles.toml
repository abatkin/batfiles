# What the corporate repository installs, for a leaf repository that includes
# it. Only an `include-remote` reads this file: a remote an action merely
# installs *from* never has its manifest opened, which is why the other fixtures
# committed into bare repositories do not carry one.
#
# Everything here is an ordinary action, declared exactly as a leaf would
# declare it. The one rule that is not a leaf's is what an included action may
# not write: a source naming a remote, which belongs to the leaf repository.

# The settings an employer publishes once, kept beside the personal `~/.zshrc`
# rather than replacing it: a leaf repository sources this from its own.
[[actions]]
type = "symlink"
id = "zshrc"
group = "shell"
source = "files/zshrc"
dest = "~/.zshrc.corporate"

# A second group, so that a leaf repository can take the shell settings without
# the prompt that comes with them, or the other way round.
[[actions]]
type = "symlink"
id = "p10k"
group = "prompt"
source = "files/p10k.zsh"
dest = "~/.p10k.zsh"

# The two files a new machine starts from and then edits: a registry and a
# commit identity nobody wants overwritten on the next sync. Declared in no
# group, which is what a group filter cannot name.
[[actions]]
type = "copy-dir"
id = "seeds"
source-dir = "seed"
dest-dir = "~/.config/corporate"
